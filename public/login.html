<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground Defense — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1B1E24;
    --panel: #242A33;
    --panel-alt: #2E3540;
    --line: #3A4250;
    --text: #F5F1E8;
    --text-dim: #9AA3B1;
    --yellow: #F2B705;
    --red: #E4572E;
    --blue: #3AAED8;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  /* Fond : lignes de craie façon marelle, en diagonale, discrètes */
  .chalk-lines{
    position:fixed; inset:0;
    background-image:
      repeating-linear-gradient(115deg, rgba(245,241,232,0.035) 0px, rgba(245,241,232,0.035) 2px, transparent 2px, transparent 64px),
      repeating-linear-gradient(25deg, rgba(245,241,232,0.02) 0px, rgba(245,241,232,0.02) 2px, transparent 2px, transparent 90px);
    pointer-events:none;
  }

  .wrap{
    position:relative;
    width:100%;
    max-width:420px;
    padding: 32px 20px;
  }

  .brand{
    text-align:center;
    margin-bottom: 28px;
  }
  .brand .mark{
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family: var(--font-display);
    font-weight:700;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
  }
  .brand .mark svg{ flex-shrink:0; }
  .brand .tag{
    margin-top:6px;
    color: var(--text-dim);
    font-size: 0.88rem;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 8px;
  }

  .tabs{
    display:flex;
    gap:4px;
    padding:6px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding: 10px 0;
    border-radius: 9px;
    font-family: var(--font-display);
    font-weight:500;
    font-size: 0.95rem;
    color: var(--text-dim);
    cursor:pointer;
    border:none;
    background:transparent;
    transition: background .15s ease, color .15s ease;
  }
  .tab.active{
    background: var(--panel-alt);
    color: var(--text);
  }

  form{
    display:none;
    flex-direction:column;
    gap: 14px;
    padding: 18px 20px 22px;
  }
  form.active{ display:flex; }

  label{
    font-size: 0.82rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    display:block;
  }
  .field input{
    width:100%;
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 11px 13px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 0.95rem;
    outline:none;
    transition: border-color .15s ease;
  }
  .field input:focus{
    border-color: var(--blue);
  }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }

  .hint{
    font-size:0.78rem;
    color: var(--text-dim);
  }

  .btn{
    border:none;
    border-radius: 9px;
    padding: 12px 16px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.98rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .1s ease, filter .15s ease;
  }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{
    background: var(--yellow);
    color: #1B1E24;
  }
  .btn-primary:hover{ filter: brightness(1.08); }

  .divider{
    display:flex;
    align-items:center;
    gap:12px;
    color: var(--text-dim);
    font-size: 0.78rem;
    padding: 2px 0;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  .oauth-group{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .btn-oauth{
    background: var(--panel-alt);
    color: var(--text);
    border: 1px solid var(--line);
  }
  .btn-oauth:hover{ background: #343c48; }
  .btn-oauth svg{ width:18px; height:18px; }

  .error{
    display:none;
    background: rgba(228,87,46,0.12);
    border: 1px solid rgba(228,87,46,0.4);
    color: #F3A98F;
    font-size: 0.82rem;
    padding: 9px 12px;
    border-radius: 8px;
  }
  .error.show{ display:block; }

  .footnote{
    text-align:center;
    margin-top: 18px;
    color: var(--text-dim);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<div class="chalk-lines"></div>

<div class="wrap">
  <div class="brand">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <rect x="2" y="18" width="6" height="10" fill="#F2B705"/>
        <rect x="12" y="10" width="6" height="18" fill="#E4572E"/>
        <rect x="22" y="4" width="6" height="24" fill="#3AAED8"/>
      </svg>
      Playground Defense
    </div>
    <div class="tag">Construis. Défends. Grimpe dans le classement.</div>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Connexion</button>
      <button class="tab" id="tab-register" onclick="switchTab('register')">Créer un compte</button>
    </div>

    <!-- CONNEXION -->
    <form id="form-login" class="active" onsubmit="return handleLogin(event)">
      <div class="error" id="login-error"></div>
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary">Se connecter</button>

      <div class="divider">ou continue avec</div>
      <div class="oauth-group">
        <button type="button" class="btn btn-oauth" onclick="oauthLogin('google')">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3 14.7 2 12 2 6.9 2 2.7 6.2 2.7 11.3S6.9 20.6 12 20.6c6.9 0 9.6-4.8 9.6-7.3 0-.5-.05-.9-.13-1.3H12z"/></svg>
          Continuer avec Google
        </button>
        <button type="button" class="btn btn-oauth" onclick="oauthLogin('discord')">
          <svg viewBox="0 0 24 24"><path fill="#5865F2" d="M20.3 5.3A18 18 0 0 0 15.8 4l-.25.45a13.8 13.8 0 0 1 4 2 15.6 15.6 0 0 0-13.1 0 13.8 13.8 0 0 1 4-2L10.2 4a18 18 0 0 0-4.5 1.3C2.9 9.2 2.1 13 2.5 16.7a18.2 18.2 0 0 0 5.5 2.8l.9-1.5a11.6 11.6 0 0 1-1.9-.9l.45-.35a13 13 0 0 0 9.1 0l.45.35a11.6 11.6 0 0 1-1.9.9l.9 1.5a18.1 18.1 0 0 0 5.5-2.8c.5-4.3-.6-8-3.15-11.4zM9.7 14.3c-.85 0-1.55-.8-1.55-1.75s.68-1.75 1.55-1.75 1.57.8 1.55 1.75c0 .96-.68 1.75-1.55 1.75zm5.1 0c-.85 0-1.55-.8-1.55-1.75s.68-1.75 1.55-1.75 1.57.8 1.55 1.75c0 .96-.68 1.75-1.55 1.75z"/></svg>
          Continuer avec Discord
        </button>
      </div>
    </form>

    <!-- CREATION DE COMPTE -->
    <form id="form-register" onsubmit="return handleRegister(event)">
      <div class="error" id="register-error"></div>
      <div class="field">
        <label for="reg-username">Pseudo</label>
        <input type="text" id="reg-username" placeholder="TonPseudo" minlength="3" maxlength="20" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reg-password">Mot de passe</label>
          <input type="password" id="reg-password" placeholder="8 caractères min." minlength="8" required>
        </div>
        <div class="field">
          <label for="reg-password2">Confirmation</label>
          <input type="password" id="reg-password2" placeholder="••••••••" minlength="8" required>
        </div>
      </div>
      <span class="hint">En créant un compte tu obtiens un ELO de départ de 1000 en 1V1 et en 2V2.</span>
      <button type="submit" class="btn btn-primary">Créer mon compte</button>

      <div class="divider">ou continue avec</div>
      <div class="oauth-group">
        <button type="button" class="btn btn-oauth" onclick="oauthLogin('google')">
          <svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.3-1.7 3.8-5.5 3.8-3.3 0-6-2.7-6-6.1s2.7-6.1 6-6.1c1.9 0 3.1.8 3.9 1.5l2.6-2.5C16.9 3 14.7 2 12 2 6.9 2 2.7 6.2 2.7 11.3S6.9 20.6 12 20.6c6.9 0 9.6-4.8 9.6-7.3 0-.5-.05-.9-.13-1.3H12z"/></svg>
          Continuer avec Google
        </button>
        <button type="button" class="btn btn-oauth" onclick="oauthLogin('discord')">
          <svg viewBox="0 0 24 24"><path fill="#5865F2" d="M20.3 5.3A18 18 0 0 0 15.8 4l-.25.45a13.8 13.8 0 0 1 4 2 15.6 15.6 0 0 0-13.1 0 13.8 13.8 0 0 1 4-2L10.2 4a18 18 0 0 0-4.5 1.3C2.9 9.2 2.1 13 2.5 16.7a18.2 18.2 0 0 0 5.5 2.8l.9-1.5a11.6 11.6 0 0 1-1.9-.9l.45-.35a13 13 0 0 0 9.1 0l.45.35a11.6 11.6 0 0 1-1.9.9l.9 1.5a18.1 18.1 0 0 0 5.5-2.8c.5-4.3-.6-8-3.15-11.4zM9.7 14.3c-.85 0-1.55-.8-1.55-1.75s.68-1.75 1.55-1.75 1.57.8 1.55 1.75c0 .96-.68 1.75-1.55 1.75zm5.1 0c-.85 0-1.55-.8-1.55-1.75s.68-1.75 1.55-1.75 1.57.8 1.55 1.75c0 .96-.68 1.75-1.55 1.75z"/></svg>
          Continuer avec Discord
        </button>
      </div>
    </form>
  </div>

  <div class="footnote">Serveur : Render — api.playgrounddefense.exemple.com</div>
</div>

<script>
  // Adresse de ton backend Render (à remplacer par l'URL réelle une fois déployé)
  const API_BASE = "https://playground-defense-api.onrender.com";

  function switchTab(which){
    document.getElementById('tab-login').classList.toggle('active', which === 'login');
    document.getElementById('tab-register').classList.toggle('active', which === 'register');
    document.getElementById('form-login').classList.toggle('active', which === 'login');
    document.getElementById('form-register').classList.toggle('active', which === 'register');
  }

  function showError(id, message){
    const el = document.getElementById(id);
    el.textContent = message;
    el.classList.add('show');
  }
  function clearError(id){
    document.getElementById(id).classList.remove('show');
  }

  async function handleLogin(e){
    e.preventDefault();
    clearError('login-error');
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    try{
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.message || "Connexion impossible");
      localStorage.setItem('pd_token', data.token);
      window.location.href = 'home.html';
    }catch(err){
      showError('login-error', err.message);
    }
    return false;
  }

  async function handleRegister(e){
    e.preventDefault();
    clearError('register-error');
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const password2 = document.getElementById('reg-password2').value;
    if(password !== password2){
      showError('register-error', "Les mots de passe ne correspondent pas.");
      return false;
    }
    try{
      const res = await fetch(`${API_BASE}/api/auth/register`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.message || "Inscription impossible");
      localStorage.setItem('pd_token', data.token);
      window.location.href = 'home.html';
    }catch(err){
      showError('register-error', err.message);
    }
    return false;
  }

  function oauthLogin(provider){
    // Redirige vers le backend Render, qui gère le flux OAuth (Passport.js)
    window.location.href = `${API_BASE}/api/auth/${provider}`;
  }
</script>
</body>
</html>
